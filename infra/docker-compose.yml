name: forgeos

services:
  postgres:
    image: postgres:16-alpine
    container_name: forgeos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: forgeos
      POSTGRES_PASSWORD: forgeos
      POSTGRES_DB: forgeos
    ports:
      - "5432:5432"
    volumes:
      - forgeos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeos -d forgeos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  forgeos-pgdata:
